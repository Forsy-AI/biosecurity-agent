services:
  biosecurity-agent:
    build: .
    environment:
      BIOSECURITY_DATA_DIR: /data
      BIOSECURITY_DOCKER_BIND: "true"
      BIOSECURITY_OFFLINE: "true"
    volumes:
      - biosecurity-data:/data
    ports:
      - "127.0.0.1:7331:7331"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('dns').lookup(require('os').hostname(),{family:4},(e,a)=>e?process.exit(1):fetch('http://'+a+':7331/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1)))",
        ]
      interval: 15s
      timeout: 4s
      retries: 5

  searxng:
    image: searxng/searxng:2025.8.11-1e4cb63
    profiles: ["search"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro

volumes:
  biosecurity-data:
